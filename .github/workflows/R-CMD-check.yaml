name: R-CMD-check

on:
  push:
    branches: [main, feature/complete-selective-dropout-framework]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
      - name: Surface R CMD check diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          found=0
          while IFS= read -r log; do
            found=1
            echo "::group::$log"
            tail -n 160 "$log"
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=R CMD check::$line"
            done < <(tail -n 120 "$log")
            echo "::endgroup::"
          done < <(find . -type f \( -name '00check.log' -o -name 'testthat.Rout.fail' \) -print)
          if [ "$found" -eq 0 ]; then
            echo "::error title=R CMD check::check-r-package failed but no 00check.log/testthat.Rout.fail was found"
          fi