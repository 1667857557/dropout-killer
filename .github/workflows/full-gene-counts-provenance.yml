name: Full-gene PBMC counts provenance

on:
  push:
    branches:
      - benchmark/full-gene-h-alra-20260907
    paths:
      - '.github/workflows/full-gene-counts-provenance.yml'
  workflow_dispatch:

jobs:
  counts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal Python dependencies
        run: python -m pip install --quiet numpy scipy h5py
      - name: Download official Cell Ranger ARC 1.0.0 matrix
        run: |
          curl -L --fail --retry 4 \
            -o pbmc_full.h5 \
            https://cf.10xgenomics.com/samples/cell-arc/1.0.0/pbmc_granulocyte_sorted_10k/pbmc_granulocyte_sorted_10k_filtered_feature_bc_matrix.h5
      - name: Check all-gene provenance
        run: |
          python - <<'PY'
          import json, h5py, numpy as np
          from scipy import sparse
          with h5py.File('pbmc_full.h5','r') as h:
              g=h['matrix']
              shape=tuple(map(int,g['shape'][...]))
              data=g['data'][...]
              indices=g['indices'][...]
              indptr=g['indptr'][...]
              ft=np.array([x.decode() if isinstance(x,bytes) else str(x) for x in g['features']['feature_type'][...]])
              names=np.array([x.decode() if isinstance(x,bytes) else str(x) for x in g['features']['name'][...]])
              bar=np.array([x.decode() if isinstance(x,bytes) else str(x) for x in g['barcodes'][...]])
          M=sparse.csc_matrix((data,indices,indptr),shape=shape)
          gi=np.flatnonzero(ft=='Gene Expression')
          G=M[gi,:].tocsc()
          lib=np.asarray(G.sum(axis=0)).ravel()
          keep=lib>0
          C=G[:,keep].tocsc()
          det=np.asarray((C>0).sum(axis=1)).ravel()/C.shape[1]
          old=det>=0.05
          Cold=C[old,:]
          zero=1-Cold.nnz/(Cold.shape[0]*Cold.shape[1])
          out={
            'raw_feature_shape':shape,
            'gene_expression_features':int(len(gi)),
            'raw_barcodes':int(G.shape[1]),
            'rna_nonzero_cells':int(C.shape[1]),
            'genes_detection_ge_5pct':int(old.sum()),
            'zero_fraction_detection_ge_5pct':float(zero),
            'all_gene_zero_fraction':float(1-C.nnz/(C.shape[0]*C.shape[1])),
            'first_cells':bar[keep][:6].tolist(),
            'last_cells':bar[keep][-6:].tolist(),
            'pass_36601x10412':bool(C.shape==(36601,10412)),
            'pass_8793':bool(old.sum()==8793),
            'pass_old_zero':bool(abs(zero-0.78794472)<5e-4)
          }
          out['all_pass']=out['pass_36601x10412'] and out['pass_8793'] and out['pass_old_zero']
          print(json.dumps(out,indent=2))
          open('counts_provenance.json','w').write(json.dumps(out,indent=2))
          if not out['all_pass']:
              raise SystemExit('COUNTS PROVENANCE FAILURE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: counts-provenance
          path: counts_provenance.json
